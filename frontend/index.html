<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  <link rel="icon" href="/icons/portfolio_manager.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="PortfolioPilot - Modern Portfolio Management"
    />
  <link rel="apple-touch-icon" href="/icons/portfolio_manager_192x192.png" />
    <link rel="manifest" href="/public/manifest.json" />
    <title>Portfolio Manager</title>
    <script src="https://cdn.tailwindcss.com"></script> <!-- Added Tailwind CSS -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Runtime configuration loader: synchronously read /config.json so modules see it on startup -->
    <script>
      (function() {
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', '/config.json', false); // synchronous on purpose for bootstrap
          xhr.send(null);
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              var cfg = JSON.parse(xhr.responseText);
              if (cfg && cfg.API_BASE_URL) {
                window.__API_BASE_URL__ = cfg.API_BASE_URL;
                console.log('[config] API_BASE_URL set to', cfg.API_BASE_URL);
              }
            } catch (e) {
              // invalid JSON -> ignore
            }
          }
        } catch (e) {
          // failure (network / CORS / not found) -> ignore and let app fallback
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('[PWA] Service worker registered', reg.scope);
          }).catch(err => console.warn('[PWA] SW registration failed', err));
        });
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
