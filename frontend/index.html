<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  <link rel="icon" href="/icons/portfolio_manager.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="PortfolioPilot - Modern Portfolio Management"
    />
  <!-- <link rel="apple-touch-icon" href="/icons/portfolio_manager_icon_192x192.png" /> -->
  <link rel="icon" type="image/x-icon" href="/icons/portfolio_manager_icon_192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Portfolio Manager</title>
    <script src="https://cdn.tailwindcss.com"></script> <!-- Added Tailwind CSS -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Runtime configuration loader: synchronously read /config.json so modules see it on startup -->
    <script>
      (function() {
        try {
          var xhr = new XMLHttpRequest();
          // use a root-relative path so it works even when the site is hosted under a subpath
          xhr.open('GET', '/config.json', false); // synchronous on purpose for bootstrap
          xhr.send(null);
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              var cfg = JSON.parse(xhr.responseText);
              if (cfg) {
                // accept either API_BASE_URL (preferred) or VITE_API_URL (older convention)
                var val = cfg.API_BASE_URL || cfg.VITE_API_URL;
                if (typeof val === 'string' && val.trim()) {
                  window.__API_BASE_URL__ = val.trim();
                  console.log('[config] runtime config set window.__API_BASE_URL__ =', val.trim());
                } else {
                  console.warn('[config] config.json found but no API_BASE_URL/VITE_API_URL');
                }
              }
            } catch (e) {
              console.warn('[config] failed to parse /config.json:', e && e.message ? e.message : e);
            }
          } else {
            // non-2xx status (404 common) - log for debugging
            console.info('[config] /config.json not found (status ' + xhr.status + ')');
          }
        } catch (e) {
          // failure (network / CORS / not found) -> ignore and let app fallback
          console.info('[config] /config.json load failed:', e && e.message ? e.message : e);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('[PWA] Service worker registered', reg.scope);
          }).catch(err => console.warn('[PWA] SW registration failed', err));
        });
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
